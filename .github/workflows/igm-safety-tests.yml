name: IGM Offline Safety Regression Tests
on:
  push:
    branches:
      - main
      - tests/permanent-pipeline-safety-20261029
    paths:
      - 'src/igm/**'
      - 'tests/**'
      - '.github/workflows/igm-safety-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All safety tests, no credentials, no publishing
        env:
          PYTHONPATH: src
          IGM_ENABLE_PUBLISH: 'false'
        run: python -m unittest discover -s tests -v
