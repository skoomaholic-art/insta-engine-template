name: MyBrand AI - Instagram Manager

on:
  schedule:
    # 02:20 UTC = 07:20 Asia/Almaty; GitHub may delay scheduled runs.
    - cron: '20 2 * * *'
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      command:
        description: 'status / plan / report / help'
        required: true
        default: 'status'
        type: choice
        options: [status, plan, report, snapshot, trend, help]

permissions:
  contents: write
  issues: write

concurrency:
  group: igm-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  command:
    # Only repo owner's [IGM] issues can execute.
    if: ${{ github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[IGM]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests before performing any command
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Execute requested command
        env:
          PYTHONPATH: src
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
          IG_AUTH_MODE: instagram
          IG_EXPECTED_USERNAME: ${{ vars.IG_EXPECTED_USERNAME }}
          IGM_ENABLE_PUBLISH: ${{ vars.IGM_ENABLE_PUBLISH }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          PIPELINE_BASE_URL: ${{ vars.PIPELINE_BASE_URL }}
          DISPATCH_COMMAND: ${{ inputs.command }}
        run: |
          if [ '${{ github.event_name }}' = 'issues' ]; then
            python -m igm --from-event --out result.md
          elif [ '${{ github.event_name }}' = 'schedule' ]; then
            python -m igm --command snapshot --out result.md
          else
            python -m igm --command "$DISPATCH_COMMAND" --out result.md
          fi
      - name: Reply in the issue
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file result.md
