name: Cover Studio layout compatibility (offline)
on:
  push:
    branches:
      - fix/cover-studio-preserve-background-layout-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-layout:
    if: ${{ !endsWith(github.repository, '-template') }}  # в самом шаблоне не запускается, только в твоей копии
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline IGM regression suite (no API tokens)
        env:
          PYTHONPATH: src
          IGM_ENABLE_PUBLISH: 'false'
        run: python -m unittest discover -s tests -v
