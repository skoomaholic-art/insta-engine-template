name: MyBrand - Music library for Reels (manual)
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: igm-pipeline
  cancel-in-progress: false
jobs:
  music:
    if: ${{ !endsWith(github.repository, '-template') }}  # в самом шаблоне не запускается, только в твоей копии
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Download CC BY tracks
        run: |
          python scripts/music_fetch.py | tee music.txt
          tr '\n' '~' < music.txt | sed 's/^/::notice::/'; echo
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/music content/music.json
          git diff --cached --quiet && exit 0
          git commit -q -m "music: starter library for Reels (CC BY 4.0)"
          for i in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; done
          exit 1
