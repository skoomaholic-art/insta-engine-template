name: MyBrand AI - Safe Autopilot

on:
  schedule:
    # 18:30 and 21:00 Asia/Almaty (UTC+5); scheduled GitHub runs can be delayed.
    - cron: '30 13,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: igm-autopilot-publish
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safety and publication queue
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Publish at most one due and rights-cleared image
        env:
          PYTHONPATH: src
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
          IG_AUTH_MODE: instagram
          IG_EXPECTED_USERNAME: ${{ vars.IG_EXPECTED_USERNAME }}
          IGM_ENABLE_PUBLISH: ${{ vars.IGM_ENABLE_PUBLISH }}
        run: python -m igm --command autopilot
